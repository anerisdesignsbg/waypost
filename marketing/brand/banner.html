<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 772px; height: 250px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(circle at 85% 20%, rgba(129, 140, 248, .45), transparent 45%),
      linear-gradient(135deg, #1e1b4b 0%, #312e81 45%, #4f46e5 100%);
    color: #fff; position: relative;
  }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 24px 24px; }
  .copy { position: absolute; left: 44px; top: 50px; width: 360px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 54px; height: 54px; border-radius: 13px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .brand h1 { font-size: 44px; font-weight: 800; letter-spacing: -1px; }
  .tag { margin-top: 14px; font-size: 18px; line-height: 1.35; color: #e0e7ff; }
  .chips { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chips span { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.2); }
  .win { position: absolute; left: 430px; top: 34px; width: 380px; height: 250px; background: #fff; border-radius: 12px 0 0 0; box-shadow: 0 18px 40px rgba(15, 12, 60, .45); color: #111827; overflow: hidden; }
  .bar { height: 26px; background: #f3f4f6; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: 1px solid #e5e7eb; }
  .bar i { width: 9px; height: 9px; border-radius: 50%; background: #d1d5db; }
  .body { display: flex; }
  .side { width: 96px; padding: 14px 10px; border-right: 1px solid #eef0f3; }
  .side b { display: block; height: 7px; border-radius: 4px; background: #e5e7eb; margin: 0 0 9px; }
  .side b.on { background: #c7d2fe; width: 80%; }
  .main { flex: 1; padding: 14px 16px; }
  .search { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 12px; color: #374151; }
  .search svg { flex: none; }
  .answer { margin-top: 12px; padding: 11px 12px; border: 1px solid #c7d2fe; border-radius: 10px; background: linear-gradient(180deg, #eef2ff, #fff); }
  .answer small { font-size: 9px; font-weight: 800; letter-spacing: .06em; color: #4f46e5; }
  .answer h2 { font-size: 14px; margin: 4px 0 5px; }
  .answer mark { background: #e0e7ff; color: inherit; padding: 0 2px; border-radius: 2px; }
  .answer p { font-size: 10.5px; line-height: 1.45; color: #4b5563; }
  .answer a { display: inline-block; margin-top: 6px; font-size: 10.5px; font-weight: 700; color: #4f46e5; }
  .rel { margin-top: 10px; }
  .rel b { display: block; height: 7px; border-radius: 4px; background: #e5e7eb; margin-bottom: 7px; }
</style></head>
<body>
  <div class="grid"></div>
  <div class="copy">
    <div class="brand"><img src="icon.svg" alt=""><h1>Waypost</h1></div>
    <p class="tag">Turn the pages you already have into a docs site with smart search.</p>
    <div class="chips"><span>Sidebar menu</span><span>Smart search</span><span>PDF search</span></div>
  </div>
  <div class="win">
    <div class="bar"><i></i><i></i><i></i></div>
    <div class="body">
      <div class="side"><b></b><b class="on"></b><b></b><b style="width:70%"></b><b></b><b style="width:60%"></b><b></b></div>
      <div class="main">
        <div class="search"><svg width="12" height="12" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.8" fill="none" stroke="#6b7280" stroke-width="1.8"/><path d="m10.6 10.6 3.4 3.4" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round"/></svg>How do I share an album?</div>
        <div class="answer">
          <small>✦ BEST ANSWER</small>
          <h2><mark>Share</mark> an <mark>album</mark></h2>
          <p>Open the album, press Share and type the names of the people to invite.</p>
          <a>Read this section →</a>
        </div>
        <div class="rel"><b style="width:85%"></b><b style="width:65%"></b></div>
      </div>
    </div>
  </div>
</body></html>
